<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Tree</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved language, direction and theme before React mounts, so
      // the first paint is already in the right direction and colour scheme.
      (() => {
        try {
          const prefs = JSON.parse(localStorage.getItem('ft:prefs') || '{}').state || {};
          const lang = prefs.locale === 'en' ? 'en' : 'ar';
          const root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          const mode = prefs.theme || 'auto';
          if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);
          const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch {
          // ignore: CSS defaults apply
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
