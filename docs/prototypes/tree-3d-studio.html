<title>Family Tree 3D Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a full-bleed 3D stage with glass overlays, a time bar that drives every scene, then R&D notes. */
:root {
  --bg: #eef1f0; --surface: #ffffff; --surface-2: #f5f7f6; --ink: #142028; --muted: #5a6a74; --line: #d3dcdf;
  --accent: #0e7f72; --accent-soft: #d6ede9; --gold: #a8690f; --glass: rgba(255, 255, 255, 0.74); --glass-line: rgba(20, 32, 40, 0.12);
  --stage: #dfe9ea; --shadow: 0 10px 30px rgba(10, 30, 40, 0.14);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c10; --surface: #0f181e; --surface-2: #0b1318; --ink: #e6eef2; --muted: #8fa2ae; --line: #22323c;
    --accent: #3fd0bd; --accent-soft: #0f3532; --gold: #e2b05a; --glass: rgba(12, 20, 26, 0.7); --glass-line: rgba(255, 255, 255, 0.1);
    --stage: #05090c; --shadow: 0 12px 34px rgba(0, 0, 0, 0.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c10; --surface: #0f181e; --surface-2: #0b1318; --ink: #e6eef2; --muted: #8fa2ae; --line: #22323c;
  --accent: #3fd0bd; --accent-soft: #0f3532; --gold: #e2b05a; --glass: rgba(12, 20, 26, 0.7); --glass-line: rgba(255, 255, 255, 0.1);
  --stage: #05090c; --shadow: 0 12px 34px rgba(0, 0, 0, 0.45); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--f-body); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: grid; gap: 14px; }

.bar { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; }
.bar h1 { margin: 0; font: 700 clamp(22px, 3vw, 30px)/1.1 var(--f-display); text-wrap: balance; }
.bar p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.bar .right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.stage { position: relative; height: clamp(520px, 74vh, 880px); border-radius: 16px; overflow: hidden; background: var(--stage);
  border: 1px solid var(--line); box-shadow: var(--shadow); isolation: isolate; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-radius: 14px; box-shadow: var(--shadow); }
.ov { position: absolute; z-index: 2; }
.scenes { inset-block-start: 14px; inset-inline-start: 14px; display: grid; gap: 2px; padding: 6px; width: 200px; }
.scenes button { display: grid; text-align: start; line-height: 1.2; padding: 7px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
.scenes button span { font-size: 14px; font-weight: 600; color: var(--ink); }
.scenes button small { font-size: 11.5px; }
.scenes button:hover { background: var(--accent-soft); }
.scenes button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.scenes button[aria-pressed="true"] span { color: var(--surface); }
.search { inset-block-start: 14px; inset-inline-end: 14px; width: min(300px, calc(100% - 28px)); }
.search input { width: 100%; box-sizing: border-box; border: 1px solid var(--glass-line); background: var(--glass); border-radius: 12px; padding: 9px 12px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.search ul { list-style: none; margin: 6px 0 0; padding: 4px; }
.search li button { width: 100%; text-align: start; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; display: flex; gap: 8px; align-items: center; }
.search li button:hover, .search li button:focus-visible { background: var(--accent-soft); }
.search li img { width: 26px; height: 26px; border-radius: 50%; }
.search li small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.card { inset-block-end: 14px; inset-inline-end: 14px; width: min(310px, calc(100% - 28px)); padding: 14px; display: grid; gap: 10px; }
.card .who { display: flex; gap: 12px; align-items: center; }
.card img { width: 58px; height: 58px; border-radius: 50%; flex: none; }
.card h2 { margin: 0; font: 700 18px/1.2 var(--f-display); }
.card .alt { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.card .yrs { margin: 2px 0 0; font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stats div { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; }
.stats b { display: block; font: 600 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); }
.card .row { display: flex; gap: 8px; }
.card .row button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 8px; font-size: 13px; }
.tip { pointer-events: none; padding: 8px 10px; display: flex; gap: 10px; align-items: center; max-width: 260px; }
.tip img { width: 40px; height: 40px; border-radius: 50%; }
.tip b { display: block; font-size: 14px; }
.tip span { font: 11.5px var(--f-mono); color: var(--muted); }
.hud { inset-block-end: 14px; inset-inline-start: 14px; padding: 6px 10px; font: 12px/1.5 var(--f-body); font-variant-numeric: tabular-nums; color: var(--muted); display: grid; gap: 1px; min-width: 150px; }
.hud b { color: var(--ink); font-weight: 500; }
.hud .q { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.tools { inset-block-start: 74px; inset-inline-end: 14px; display: flex; gap: 6px; }
.tools button { border: 1px solid var(--glass-line); background: var(--glass); border-radius: 10px; padding: 6px 10px; font-size: 13px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.lbl { position: absolute; left: 0; top: 0; display: grid; justify-items: center; padding: 2px 9px 3px; border-radius: 9px; white-space: nowrap;
  background: var(--glass); border: 1px solid color-mix(in srgb, var(--fam, var(--accent)) 55%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: opacity .25s ease; will-change: transform; }
.lbl b { font-size: 12px; font-weight: 600; line-height: 1.25; color: var(--ink); }
.lbl span { font: 10.5px/1.2 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.lbl.dim { opacity: .3; }
/* Year ranges always read left to right, even inside Arabic text */
.lbl span, .card .yrs, .search small, .yr-ltr { direction: ltr; unicode-bidi: isolate; }
.lbl.pri { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.notice { inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
.notice p { max-width: 420px; }

.time { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--line); }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--surface); display: grid; place-items: center; }
.play svg { width: 18px; height: 18px; fill: currentColor; }
[dir="rtl"] .play svg.tri { transform: scaleX(-1); }
.track { position: relative; min-width: 0; display: grid; gap: 2px; }
.track canvas { width: 100%; height: 34px; display: block; }
[dir="rtl"] .track canvas { transform: scaleX(-1); }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.year { font: 500 28px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: center; }
.under { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.under label { display: inline-flex; gap: 6px; align-items: center; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; vertical-align: -1px; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.notes section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.notes h3 { margin: 0 0 8px; font: 700 16px var(--f-display); }
.notes ul, .notes ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }
.notes a { color: var(--accent); }
.notes b { font-weight: 600; }
@media (max-width: 720px) {
  .stage { height: 78vh; }
  .card { inset-inline: 10px; width: auto; inset-block-end: 10px; }
  .scenes { inset-inline: 10px; width: auto; display: flex; overflow-x: auto; scrollbar-width: none; inset-block-start: 10px; }
  .scenes button { flex: none; }
  .scenes button small { display: none; }
  .hud { display: none; }
  .search { inset-block-start: auto; inset-block-end: 14px; inset-inline: 10px; width: auto; }
  .search:has(~ .card:not([hidden])) { display: none; }
  .tools { inset-block-start: auto; inset-block-end: 70px; inset-inline-end: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app" dir="ltr" lang="en">
  <header class="bar">
    <div>
      <h1 data-t="title"></h1>
      <p data-t="sub"></p>
    </div>
    <div class="right">
      <div class="seg" role="group" data-ta="aSize">
        <button id="dSample" aria-pressed="true" data-t="dSample"></button>
        <button id="dStress" aria-pressed="false" data-t="dStress"></button>
      </div>
      <div class="seg" role="group" data-ta="aLang">
        <button id="lEn" aria-pressed="true">English</button>
        <button id="lAr" aria-pressed="false" lang="ar">عربي</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="c"></canvas>
    <nav class="ov scenes glass" data-ta="aScene">
      <button data-scene="tree" aria-pressed="true"><span data-t="sTree"></span><small data-t="sTreeD"></small></button>
      <button data-scene="river" aria-pressed="false"><span data-t="sRiver"></span><small data-t="sRiverD"></small></button>
      <button data-scene="hour" aria-pressed="false"><span data-t="sHour"></span><small data-t="sHourD"></small></button>
      <button data-scene="city" aria-pressed="false"><span data-t="sCity"></span><small data-t="sCityD"></small></button>
      <button data-scene="mandala" aria-pressed="false"><span data-t="sMandala"></span><small data-t="sMandalaD"></small></button>
      <button data-scene="sky" aria-pressed="false"><span data-t="sSky"></span><small data-t="sSkyD"></small></button>
      <button data-scene="glass" aria-pressed="false"><span data-t="sGlass"></span><small data-t="sGlassD"></small></button>
    </nav>
    <div class="ov search">
      <input id="q" type="search" autocomplete="off" data-tp="search">
      <ul id="qList" class="glass" hidden></ul>
    </div>
    <div class="ov tools">
      <button id="tFit" data-t="fit"></button>
      <button id="tSpin" aria-pressed="true" data-t="spin"></button>
      <button id="tFull" data-t="full"></button>
    </div>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="ov tip glass" id="tip" hidden></div>
    <aside class="ov card glass" id="card" hidden aria-live="polite"></aside>
    <div class="ov hud glass" id="hud"></div>
    <div class="ov notice" id="notice" hidden><p class="glass" style="padding:16px" id="noticeText"></p></div>
  </main>

  <section class="time" data-ta="aTime">
    <button class="play" id="play"></button>
    <div class="track">
      <canvas id="hist" aria-hidden="true"></canvas>
      <input type="range" id="yr" min="1900" max="2026" step="1" value="2026">
    </div>
    <output class="year" id="yrOut" for="yr">2026</output>
  </section>
  <div class="under">
    <span id="status"></span>
    <label><input type="checkbox" id="follow" checked> <span data-t="follow"></span></label>
    <div class="legend" id="legend"></div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/controls/OrbitControls.js/+esm';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/EffectComposer.js/+esm';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/RenderPass.js/+esm';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/UnrealBloomPass.js/+esm';
import { OutputPass } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/OutputPass.js/+esm';

// ======================= Data =======================
const FAM = {
  mansouri: { en: 'Al Mansouri', ar: 'المنصوري', c: '#2fb3a3' }, kaabi: { en: 'Al Kaabi', ar: 'الكعبي', c: '#d99a3a' },
  zaabi: { en: 'Al Zaabi', ar: 'الزعابي', c: '#9a7ff0' }, suwaidi: { en: 'Al Suwaidi', ar: 'السويدي', c: '#e26e8f' },
  mazrouei: { en: 'Al Mazrouei', ar: 'المزروعي', c: '#4d9be0' }, shamsi: { en: 'Al Shamsi', ar: 'الشامسي', c: '#8cbf45' },
  ketbi: { en: 'Al Ketbi', ar: 'الكتبي', c: '#e5824a' }, hammadi: { en: 'Al Hammadi', ar: 'الحمادي', c: '#6b7cf0' },
  marri: { en: 'Al Marri', ar: 'المري', c: '#d36ac4' }, nuaimi: { en: 'Al Nuaimi', ar: 'النعيمي', c: '#9aa7b3' },
};
const P = (id, en, ar, sex, born, died, fam = 'mansouri', extra = {}) => ({ id, en, ar, sex, born, died, fam, mi: fam !== 'mansouri', ...extra });
const SAMPLE = {
  people: [
    P('k1', 'Khalid', 'خالد', 'M', 1905, 1978), P('f1', 'Fatima', 'فاطمة', 'F', 1910, 1990, 'kaabi'),
    P('a1', 'Ahmed', 'أحمد', 'M', 1930, 2005), P('ai', 'Aisha', 'عائشة', 'F', 1935, 2018, 'zaabi'), P('no', 'Noura', 'نورة', 'F', 1945, null, 'suwaidi'),
    P('m1', 'Mariam', 'مريم', 'F', 1933, 2015), P('s1', 'Saeed', 'سعيد', 'M', 1936, 2012), P('sh', 'Shaikha', 'شيخة', 'F', 1940, null, 'mazrouei'),
    P('ra', 'Rashid', 'راشد', 'M', 1957, null), P('am', 'Amna', 'آمنة', 'F', 1962, null, 'shamsi'), P('he', 'Hessa', 'حصة', 'F', 1960, null),
    P('om', 'Omar', 'عمر', 'M', 1972, null), P('re', 'Reem', 'ريم', 'F', 1998, null, 'hammadi'),
    P('su', 'Sultan', 'سلطان', 'M', 1964, null), P('mo', 'Moza', 'موزة', 'F', 1968, null, 'ketbi'), P('la', 'Latifa', 'لطيفة', 'F', 1967, null),
    P('kh', 'Khalid', 'خالد', 'M', 1986, null), P('da', 'Dana', 'دانة', 'F', 1990, null, 'marri'), P('mh', 'Mohammed', 'محمد', 'M', 1989, null),
    P('sa', 'Sara', 'سارة', 'F', 1992, null), P('za', 'Zayed', 'زايد', 'M', 2022, null), P('hm', 'Hamdan', 'حمدان', 'M', 1992, null),
    P('al', 'Alyaa', 'علياء', 'F', 1995, null), P('ft', 'Fatima', 'فاطمة', 'F', 2016, null),
  ],
  unions: [
    { id: 'u1', a: 'k1', b: 'f1', year: 1928, kids: ['a1', 'm1', 's1'] }, { id: 'u2', a: 'a1', b: 'ai', year: 1955, kids: ['ra', 'he'] },
    { id: 'u3', a: 'a1', b: 'no', year: 1970, kids: ['om'] }, { id: 'u4', a: 's1', b: 'sh', year: 1962, kids: ['su', 'la'] },
    { id: 'u5', a: 'ra', b: 'am', year: 1984, kids: ['kh', 'mh', 'sa'] }, { id: 'u6', a: 'su', b: 'mo', year: 1990, kids: ['hm', 'al'] },
    { id: 'u7', a: 'om', b: 're', year: 2020, kids: ['za'] }, { id: 'u8', a: 'kh', b: 'da', year: 2014, kids: ['ft'] },
  ],
  biz: [
    { id: 'b1', en: 'Mansouri Pearling', ar: 'لؤلؤ المنصوري', year: 1950, owners: ['k1'] },
    { id: 'b2', en: 'Al Mansouri Trading', ar: 'المنصوري للتجارة', year: 1962, owners: ['a1', 's1'] },
    { id: 'b3', en: 'Mansouri Logistics', ar: 'المنصوري للخدمات اللوجستية', year: 2010, owners: ['kh', 'hm'] },
  ],
};
const MALE = [['Khalid', 'خالد'], ['Ahmed', 'أحمد'], ['Saeed', 'سعيد'], ['Rashid', 'راشد'], ['Omar', 'عمر'], ['Sultan', 'سلطان'], ['Hamdan', 'حمدان'], ['Mohammed', 'محمد'],
  ['Zayed', 'زايد'], ['Majid', 'ماجد'], ['Faisal', 'فيصل'], ['Saif', 'سيف'], ['Hamad', 'حمد'], ['Ali', 'علي'], ['Yousef', 'يوسف'], ['Abdullah', 'عبدالله']];
const FEMALE = [['Fatima', 'فاطمة'], ['Aisha', 'عائشة'], ['Mariam', 'مريم'], ['Hessa', 'حصة'], ['Latifa', 'لطيفة'], ['Sara', 'سارة'], ['Alyaa', 'علياء'], ['Moza', 'موزة'],
  ['Noura', 'نورة'], ['Shaikha', 'شيخة'], ['Amna', 'آمنة'], ['Reem', 'ريم'], ['Dana', 'دانة'], ['Maitha', 'ميثاء'], ['Hind', 'هند'], ['Salama', 'سلامة']];
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// A generated 500-person family to test scale (invented names and dates)
function synthetic(N) {
  const r = rng(11), pick = a => a[Math.floor(r() * a.length)], people = [], unions = [];
  const others = Object.keys(FAM).filter(k => k !== 'mansouri' && k !== 'nuaimi');
  const death = born => (born < 1965 && r() < Math.min(0.97, (2026 - born - 50) / 45) ? Math.min(2025, born + 52 + Math.floor(r() * 38)) : null);
  const mk = (sex, born, fam) => { const n = pick(sex === 'M' ? MALE : FEMALE); const p = { id: `s${people.length}`, en: n[0], ar: n[1], sex, born, died: death(born), fam, mi: fam !== 'mansouri' }; people.push(p); return p; };
  const root = mk('M', 1872, 'mansouri'); root.died = 1941;
  const q = [root];
  while (q.length && people.length < N) {
    const p = q.shift();
    if (p.sex === 'F' && r() < 0.6) continue; // most daughters marry into other families
    const wed = p.born + 21 + Math.floor(r() * 8); if (wed > 2021) continue;
    const s = mk(p.sex === 'M' ? 'F' : 'M', p.born + (p.sex === 'M' ? 2 : -3) + Math.floor(r() * 4), pick(others));
    const u = { id: `u${unions.length}`, a: p.id, b: s.id, year: wed, kids: [] }; unions.push(u);
    let y = wed; const nk = 2 + Math.floor(r() * 5);
    for (let i = 0; i < nk && people.length < N; i++) { y += 1 + Math.floor(r() * 3); if (y > 2025) break; const c = mk(r() < 0.55 ? 'M' : 'F', y, 'mansouri'); u.kids.push(c.id); q.push(c); }
  }
  return { people, unions, biz: [] };
}

// ======================= Model =======================
function buildModel(data) {
  const byId = {}; data.people.forEach(p => (byId[p.id] = { ...p, kids: [], spouses: [] }));
  const people = Object.values(byId), parentU = {};
  data.unions.forEach(u => {
    u.kids.forEach(k => (parentU[k] = u));
    byId[u.a].spouses.push({ id: u.b, year: u.year }); byId[u.b].spouses.push({ id: u.a, year: u.year });
  });
  people.forEach(p => { const u = parentU[p.id]; p.parents = u ? [u.a, u.b] : []; p.parent = u ? (byId[u.a].mi ? u.b : u.a) : null; });
  people.forEach(p => { if (p.parent) byId[p.parent].kids.push(p.id); });
  people.forEach(p => p.kids.sort((a, b) => byId[a].born - byId[b].born));
  // Every child of every marriage, so a mother who married in still has children (kids above is the born-in line used for layout)
  people.forEach(p => (p.children = data.unions.filter(u => u.a === p.id || u.b === p.id).flatMap(u => u.kids)));
  people.forEach(p => { if (p.mi) p.anchor = p.spouses[0]?.id ?? null; });
  const root = people.find(p => !p.mi && !p.parent);
  const gen = (id, g) => { const p = byId[id]; p.gen = g; p.kids.forEach(k => gen(k, g + 1)); }; gen(root.id, 0);
  people.forEach(p => { if (p.mi) p.gen = p.anchor ? byId[p.anchor].gen : 0; });
  const leaves = id => { const p = byId[id]; p.leaves = p.kids.length ? p.kids.reduce((s, k) => s + leaves(k), 0) : 1; return p.leaves; }; leaves(root.id);
  const assign = (id, a0, a1) => { const p = byId[id]; p.a0 = a0; p.a1 = a1; p.ang = (a0 + a1) / 2; let a = a0; p.kids.forEach(k => { const w = ((a1 - a0) * byId[k].leaves) / p.leaves; assign(k, a, a + w); a += w; }); };
  assign(root.id, 0, 1);
  people.forEach(p => { if (p.mi) p.ang = p.anchor ? byId[p.anchor].ang : 0; });
  people.forEach((p, i) => (p.idx = i));
  const maxGen = Math.max(...people.map(p => p.gen));
  const biz = data.biz.map(b => ({ ...b }));
  const minYear = Math.min(...people.map(p => p.born));
  return { people, byId, root, unions: data.unions, maxGen, biz, minYear, n: people.length };
}

// ======================= Scene: Hourglass =======================
// One person in the waist: ancestors fill the dome above, descendants the bowl below. Clicking someone recentres it.

    par.forEach((pid, j) => {

    if (ndc.z > 1) return;
    const sx = (ndc.x * 0.5 + 0.5) * r.width, sy = (-ndc.y * 0.5 + 0.5) * r.height;
    const rad = (cur.size * (p.gen === 0 && !p.mi ? 1.35 : p.mi ? 0.85 : 1) * 2.3 * 0.5 * 0.7 * f) / dist + 3;
    const d = Math.hypot(sx - x, sy - y); if (d < rad && dist < bd) { bd = dist; best = i; }
  });

}
let down = null, hoverRaf = 0;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; stopSpin(); });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; return; }
  down = null; const i = pick(e.clientX, e.clientY); select(i == null ? null : M.people[i].id);
});
canvas.addEventListener('pointermove', e => {
  if (hoverRaf) return;
  hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0; if (down) return;
    const i = pick(e.clientX, e.clientY), r = stage.getBoundingClientRect();
    S.hover = i == null ? null : M.people[i].id; canvas.style.cursor = i == null ? '' : 'pointer';
    showTip(i, e.clientX - r.left, e.clientY - r.top);
  });
});
canvas.addEventListener('pointerleave', () => { cancelAnimationFrame(hoverRaf); hoverRaf = 0; S.hover = null; tip.hidden = true; });
canvas.addEventListener('pointercancel', () => (down = null));
let spinTimer = 0;
function stopSpin() { controls.autoRotate = false; clearTimeout(spinTimer); if (S.spin) spinTimer = setTimeout(() => (controls.autoRotate = S.spin), 6000); }

// ======================= Time =======================
const yrIn = document.getElementById('yr'), yrOut = document.getElementById('yrOut'), playB = document.getElementById('play');
function setYearTarget(y) { S.year = y; yrIn.value = Math.round(y); yrOut.textContent = Math.round(y); renderStatus(); if (S.sel) renderCard(false); }
yrIn.addEventListener('input', () => setYearTarget(+yrIn.value));
const ICON_PLAY = '<svg class="tri" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
function playIcon() { playB.innerHTML = S.playing ? ICON_PAUSE : ICON_PLAY; playB.setAttribute('aria-label', S.playing ? t('pause') : t('play')); }
playB.addEventListener('click', () => { S.playing = !S.playing; if (S.playing && S.year >= 2026) setYearTarget(+yrIn.min); playIcon(); });
document.getElementById('follow').addEventListener('change', e => (S.follow = e.target.checked));
function renderStatus() {
  const y = Math.round(S.year), alive = M.people.filter(p => p.born <= y && !(p.died && p.died <= y)).length;
  document.getElementById('status').innerHTML = `<b style="color:var(--ink);font-variant-numeric:tabular-nums">${alive}</b> ${t('people')} ${t('alive')} ${y}`;
}
function drawHist() {
  const c = document.getElementById('hist'), r = c.getBoundingClientRect(), dpr = Math.min(devicePixelRatio, 2);
  c.width = r.width * dpr; c.height = r.height * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  const y0 = +yrIn.min, y1 = +yrIn.max, nb = y1 - y0 + 1, b = new Array(nb).fill(0), d = new Array(nb).fill(0);
  M.people.forEach(p => { if (p.born >= y0 && p.born <= y1) b[p.born - y0]++; if (p.died && p.died >= y0 && p.died <= y1) d[p.died - y0]++; });
  const mx = Math.max(1, ...b, ...d), cs = getComputedStyle(app), bw = r.width / nb;
  g.clearRect(0, 0, r.width, r.height);
  for (let i = 0; i < nb; i++) {
    const hb = (b[i] / mx) * (r.height * 0.62), hd = (d[i] / mx) * (r.height * 0.32);
    g.fillStyle = cs.getPropertyValue('--accent'); g.fillRect(i * bw, r.height * 0.66 - hb, Math.max(1, bw - 0.6), hb);
    g.fillStyle = cs.getPropertyValue('--muted'); g.globalAlpha = 0.6; g.fillRect(i * bw, r.height * 0.7, Math.max(1, bw - 0.6), hd); g.globalAlpha = 1;
  }
}

// ======================= Language, data set, tools =======================
function applyI18n() {
  app.dir = S.lang === 'ar' ? 'rtl' : 'ltr'; app.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(n => (n.textContent = t(n.dataset.t)));
  document.querySelectorAll('[data-tp]').forEach(n => (n.placeholder = t(n.dataset.tp)));
  document.querySelectorAll('[data-ta]').forEach(n => n.setAttribute('aria-label', t(n.dataset.ta)));
  document.getElementById('notes').innerHTML = NOTES[S.lang];
  document.getElementById('legend').innerHTML = `<span><i style="background:var(--accent)"></i>${t('lb')}</span><span><i style="background:var(--muted)"></i>${t('ld')}</span>`;
  document.getElementById('lEn').setAttribute('aria-pressed', S.lang === 'en'); document.getElementById('lAr').setAttribute('aria-pressed', S.lang === 'ar');
  Object.values(SC).forEach(sc => sc.relang?.());
  document.title = t('title'); playIcon(); renderStatus(); renderCard();
}
document.getElementById('lEn').onclick = () => { S.lang = 'en'; applyI18n(); };
document.getElementById('lAr').onclick = () => { S.lang = 'ar'; applyI18n(); };
document.querySelectorAll('[data-scene]').forEach(b => (b.onclick = () => {
  if (b.dataset.scene !== S.scene) setScene(b.dataset.scene);
  else if (S.scene === 'hour' && S.sel !== M.root.id) { S.sel = null; setScene('hour'); } // second click: back to the founder
}));
document.getElementById('tFit').onclick = () => { const v = SC[S.scene].view; flyTo(v.cam, v.target, 1200); };
document.getElementById('tSpin').onclick = e => { S.spin = !S.spin; controls.autoRotate = S.spin; e.currentTarget.setAttribute('aria-pressed', S.spin); };
document.getElementById('tSpin').setAttribute('aria-pressed', S.spin);
document.getElementById('tFull').onclick = () => { (document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen?.())?.catch?.(() => {}); };
function loadData(kind) {
  if (kind === S.data) return;
  S.data = kind; S.sel = null; S.autoSel = false; S.hover = null; tip.hidden = true; qList.hidden = true; qIn.value = ''; fly = null;
  M = buildModel(kind === 'sample' ? SAMPLE : synthetic(500));
  Object.values(SC).forEach(sc => { scene.remove(sc.group); disposeTree(sc.group); });
  Object.keys(SC).forEach(k => delete SC[k]);
  thumbCache.clear(); clearLabelCache(); buildAtlas(); buildMedals();
  U.uMinYear.value = M.minYear; yrIn.min = Math.min(1900, M.minYear - 2); drawHist();
  document.getElementById('dSample').setAttribute('aria-pressed', kind === 'sample'); document.getElementById('dStress').setAttribute('aria-pressed', kind !== 'sample');
  quality.level = 2; quality.apply();
  setScene(S.scene, true); renderStatus();
}
document.getElementById('dSample').onclick = () => loadData('sample');
document.getElementById('dStress').onclick = () => loadData('stress');

// Free GPU memory: geometries, instance buffers, materials and any textures they hold
function disposeTree(root) {
  root.traverse(o => {
    if (o.isInstancedMesh) o.dispose();
    if (!o.isSprite) o.geometry?.dispose(); // sprites share one geometry across the whole app
    [].concat(o.material || []).forEach(m => {
      Object.values(m.uniforms || {}).forEach(u => u.value?.isTexture && u.value.dispose());
      m.map?.dispose(); m.dispose();
    });
  });
}
// ======================= Adaptive quality =======================
const quality = {
  level: 2, low: 0, since: 0,
  apply() {
    const pr = this.level === 2 ? Math.min(devicePixelRatio, 2) : this.level === 1 ? 1 : 0.85;
    renderer.setPixelRatio(pr); bloom.enabled = this.level > 0; resize();
  },
  check(fps, now) {
    if (fps < (this.level === 2 ? 42 : 30) && this.level > 0) { if (!this.since) this.since = now; if (now - this.since > 2500) { this.level--; this.since = 0; this.apply(); } }
    else this.since = 0;
    if (fps > 57 && this.level < 2) { if (!this.up) this.up = now; if (now - this.up > 6000) { this.level++; this.up = 0; this.apply(); } } else this.up = 0;
  },
};
const hud = document.getElementById('hud');
let fpsAvg = 60, hudT = 0;
function renderHud() {
  const q = [t('qLow'), t('qMed'), t('qHigh')][quality.level];
  hud.innerHTML = `<div><b>${Math.round(fpsAvg)}</b> ${t('fps')} · <span class="q">${t('hudQ')}: ${q}</span></div><div><b>${M.n}</b> ${t('hudPeople')} · <b>${renderer.info.render.calls}</b> ${t('hudDraws')}</div>`;
}

// ======================= Loop =======================
function resize() {
  const r = stage.getBoundingClientRect(); if (!r.width) return;
  renderer.setSize(r.width, r.height, false); composer.setSize(r.width, r.height); composer.setPixelRatio(renderer.getPixelRatio());
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(() => { resize(); drawHist(); }).observe(stage);
let lastHook = NaN, last = performance.now(), labelT = 0, playAcc = 0, lastBirthFollow = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  U.uTime.value += dt;
  if (S.playing) {
    playAcc += dt; const step = M.n > 100 ? 0.09 : 0.14;
    while (playAcc > step) { playAcc -= step; if (S.year >= 2026) { S.playing = false; playIcon(); break; } setYearTarget(S.year + 1); }
  }
  const prevYear = U.uYear.value;
  U.uYear.value += (S.year - U.uYear.value) * (1 - Math.exp(-dt * (S.playing ? 5 : 3.5)));
  if (Math.abs(S.year - U.uYear.value) < 0.002) U.uYear.value = S.year;
  if (morph) { const k = Math.min(1, (now - morph.t0) / morph.d); medalMat.uniforms.uMorph.value = k; if (k >= 1) morph = null; }
  if (enter) { const k = Math.min(1, Math.max(0, (now - enter.t0) / enter.d)); U.uEnter.value = ease(k); if (k >= 1) enter = null; }
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.d), e = ease(k);
    camera.position.lerpVectors(fly.fc, fly.tc, e); controls.target.lerpVectors(fly.ft, fly.tt, e); if (k >= 1) fly = null;
  }

  const hookKey = Math.floor(effYear() * 4); if (cur?.yearHook && hookKey !== lastHook) { lastHook = hookKey; cur.yearHook(effYear()); }
  if (S.playing && S.follow && !reduced && now - lastBirthFollow > 900 && !fly) {
    const y = Math.round(S.year), born = M.people.filter(p => p.born === y && !p.mi);
    if (born.length) { lastBirthFollow = now; const p = personPos(born[0].idx, new THREE.Vector3()); fly = { t0: now, d: 1100, fc: camera.position.clone(), tc: camera.position.clone().lerp(p.clone().add(camera.position.clone().sub(controls.target).normalize().multiplyScalar(cur.follow * 1.6)), 0.5), ft: controls.target.clone(), tt: controls.target.clone().lerp(p, 0.6) }; }
  }
  cur?.update?.();
  controls.update();
  labelT += dt; if (labelT > 0.12) { labelT = 0; updateLabels(); }
  placeLabels();
  renderer.info.reset(); renderer.info.autoReset = false;
  composer.render();
  renderer.info.autoReset = true;
  fpsAvg += (1 / Math.max(dt, 1e-3) - fpsAvg) * 0.05;
  quality.check(fpsAvg, now);
  hudT += dt; if (hudT > 0.5) { hudT = 0; renderHud(); }
  requestAnimationFrame(frame);
}

// Theme changes repaint labels, portraits keep their colours
const retheme = () => { clearLabelCache(); Object.values(SC).forEach(s => s !== SC[S.scene] && s.tint()); SC[S.scene]?.tint(); drawHist(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ======================= Boot =======================
buildAtlas(); buildMedals();
U.uMinYear.value = M.minYear; yrIn.min = 1900;
applyI18n();
resize();
setScene('tree', true);
U.uEnter.value = 0; enter = reduced ? null : { t0: performance.now() + 300, d: 3200 }; if (reduced) U.uEnter.value = 1;
drawHist(); renderStatus();
document.fonts?.ready.then(() => clearLabelCache());
window.__studio = { S, M: () => M, SC, select, setScene, loadData, renderer, quality, U, medalMat, medalGeo };
requestAnimationFrame(frame);
</script>
