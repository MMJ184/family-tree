<title>Family Tree Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: header, then tree stage beside a person panel, then a time strip that drives every view. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #f6f8f9;
  --ink: #15222c;
  --muted: #586977;
  --line: #cfd8de;
  --line-strong: #8fa1ad;
  --dot: #d6dee3;
  --accent: #0e7268;
  --accent-soft: #d5ece9;
  --gold: #a86a12;
  --dead-fill: #e9edf0;
  --glass: rgba(255, 255, 255, 0.78);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1419; --surface: #142028; --surface-2: #101a21; --ink: #e4ecf1; --muted: #93a5b2;
    --line: #2a3a46; --line-strong: #5d7484; --dot: #1d2b35; --accent: #3cc7b6; --accent-soft: #123a37;
    --gold: #e0ad55; --dead-fill: #1a252d; --glass: rgba(20, 32, 40, 0.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1419; --surface: #142028; --surface-2: #101a21; --ink: #e4ecf1; --muted: #93a5b2;
  --line: #2a3a46; --line-strong: #5d7484; --dot: #1d2b35; --accent: #3cc7b6; --accent-soft: #123a37;
  --gold: #e0ad55; --dead-fill: #1a252d; --glass: rgba(20, 32, 40, 0.8); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--f-body); }
.app { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.top h1 { font: 700 clamp(22px, 3vw, 30px)/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; height: clamp(420px, 62vh, 720px); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background-color: var(--surface-2); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 22px 22px; }
#svg2d, .pz { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#svg2d.drag, .pz.drag { cursor: grabbing; }
#view3d { position: absolute; inset: 0; }
#view3d canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.tools { position: absolute; inset-block-start: 10px; inset-inline-end: 10px; display: flex; gap: 6px; }
.tools button { min-width: 34px; height: 34px; padding-inline: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--glass);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; font-weight: 500; }
.hint { position: absolute; inset-block-end: 10px; inset-inline-start: 12px; margin: 0; font-size: 12px; color: var(--muted);
  background: var(--glass); padding: 3px 8px; border-radius: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.notice { position: absolute; inset-inline: 16px; inset-block-start: 50%; transform: translateY(-50%); margin: 0 auto; max-width: 420px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-align: center; }

/* 2D tree */
.node rect.card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.node.sel rect.card { stroke: var(--accent); stroke-width: 2.2; }
.node.dead rect.card { fill: var(--dead-fill); stroke-dasharray: 4 3; }
.node .nm { fill: var(--ink); font: 600 13px var(--f-body); }
.node.dead .nm { fill: var(--muted); }
.node .yr { fill: var(--muted); font: 11px var(--f-mono); }
.node .tag { fill: var(--gold); font: 500 10.5px var(--f-body); }
.node .biz { fill: var(--gold); }
.node { cursor: pointer; transition: opacity .45s ease; }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.4; transition: opacity .45s ease; }
.edge.sp { stroke: var(--gold); stroke-width: 1.2; }
.union circle { fill: var(--gold); }
.union text { fill: var(--muted); font: 10px var(--f-mono); }
.union { transition: opacity .45s ease; }
.gone { opacity: 0; pointer-events: none; }

/* Panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font: 700 19px/1.25 var(--f-display); margin: 0; }
.who { display: flex; gap: 12px; align-items: flex-start; }
.whotext { min-width: 0; }
.pic { display: grid; gap: 4px; justify-items: center; flex: none; }
.pic img { width: 64px; height: 64px; border-radius: 50%; display: block; }
.addpic { font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 500; }
.addpic input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.addpic:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.panel .alt { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.panel .yrs { font: 13px var(--f-mono); color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
.panel dl { margin: 0; display: grid; gap: 10px; }
.panel dt { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.panel dd { margin: 3px 0 0; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.pl { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.pl small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.none { color: var(--muted); font-size: 13px; }
.panel .fine { font-size: 12px; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 10px; }

/* Time strip */
.time { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--surface); display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
[dir="rtl"] .play svg.tri { transform: scaleX(-1); }
.track { position: relative; padding-block-start: 16px; min-width: 0; }
.ticks { position: absolute; inset-block-start: 0; inset-inline: 8px; height: 12px; }
.tick { position: absolute; inset-block-start: 0; width: 2px; height: 12px; border-radius: 1px; }
.tick.b { background: var(--accent); }
.tick.m { background: var(--gold); height: 8px; inset-block-start: 4px; }
.tick.d { background: var(--line-strong); height: 6px; inset-block-start: 6px; }
.tick.z { background: var(--ink); width: 6px; height: 6px; inset-block-start: 3px; transform: rotate(45deg); border-radius: 1px; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.year { font: 500 26px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: center; }
.under { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between; font-size: 13px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; }
.stats strong { color: var(--ink); font-weight: 600; }

.notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.notes h3 { margin: 0 0 8px; font: 700 16px var(--f-display); }
.notes ol { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; max-width: 80ch; }
.notes b { font-weight: 600; }
/* Graph and mind map views */
.gone { opacity: 0 !important; pointer-events: none; }
.viewbox { position: absolute; inset: 0; background: var(--surface-2); }
.viewbox > div:not(.sub) { position: absolute; inset: 0; }
.sub { position: absolute; inset-block-start: 10px; inset-inline-start: 10px; display: grid; gap: 8px; justify-items: start; z-index: 2; max-width: calc(100% - 200px); }
.sub .seg { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.sub .seg button { padding: 4px 12px; font-size: 13px; }
.gset { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; min-width: 210px; }
.gset summary { cursor: pointer; padding: 6px 12px; font-weight: 600; }
.gset .rows { display: grid; gap: 8px; padding: 4px 12px 12px; }
.gset label { display: flex; align-items: center; gap: 8px; }
.gset label.rng { display: grid; gap: 2px; color: var(--muted); }
.gset input[type="range"] { width: 100%; }
.gset button { justify-self: start; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
#mindMap { direction: ltr; position: absolute !important; inset: 0; width: 100%; height: 100%; }
#mindMap .map-container { background: var(--surface-2); }
#mindMap me-tpc { font-family: var(--f-body); }

<div class="app" id="app" dir="ltr" lang="en">
  <header class="top">
    <div>
      <h1 data-t="title"></h1>
      <p data-t="sub"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button id="v2d" aria-pressed="true" data-t="tab2d"></button>
        <button id="v3d" aria-pressed="false" data-t="tab3d"></button>
        <button id="vGraph" aria-pressed="false" data-t="tabG"></button>
        <button id="vMind" aria-pressed="false" data-t="tabM"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="lEn" aria-pressed="true">English</button>
        <button id="lAr" aria-pressed="false" lang="ar">عربي</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <section class="stage" id="stage">
      <svg id="svg2d" role="img" aria-label="Family tree"><g id="vp"><g id="gEdges"></g><g id="gUnions"></g><g id="gNodes"></g></g></svg>
      <div id="graphView" class="viewbox" hidden>
        <div id="graph2d"></div>
        <div id="graph3d" hidden></div>
        <div class="sub">
          <div class="seg" role="group" aria-label="Graph mode"><button id="g2" aria-pressed="true">2D</button><button id="g3" aria-pressed="false">3D</button></div>
          <details class="gset">
            <summary data-t="gSet"></summary>
            <div class="rows">
              <label><input type="checkbox" id="oFam" checked> <span data-t="oFam"></span></label>
              <label><input type="checkbox" id="oCards" checked> <span data-t="oCards"></span></label>
              <label><input type="checkbox" id="oBiz" checked> <span data-t="oBiz"></span></label>
              <label class="rng"><span data-t="oFade"></span><input type="range" id="oFade" min="0.3" max="4" step="0.1" value="0.8"></label>
              <label class="rng"><span data-t="oSize"></span><input type="range" id="oSize" min="0.6" max="2.2" step="0.1" value="1"></label>
              <label class="rng"><span data-t="oRepel"></span><input type="range" id="oRepel" min="10" max="300" step="5" value="110"></label>
              <label class="rng"><span data-t="oDist"></span><input type="range" id="oDist" min="10" max="90" step="2" value="30"></label>
              <button id="oAnim" data-t="oAnim"></button>
            </div>
          </details>
        </div>
      </div>
      <div id="mindView" class="viewbox" hidden>
        <div id="mindMap"></div>
        <div class="sub">
          <div class="seg" role="group" aria-label="Mind map mode"><button id="mFam" aria-pressed="true" data-t="mFam"></button><button id="mPer" aria-pressed="false" data-t="mPer"></button></div>
        </div>
      </div>
      <div id="view3d" hidden></div>
      <div class="tools">
        <button id="zIn" aria-label="Zoom in">+</button>
        <button id="zOut" aria-label="Zoom out">−</button>
        <button id="fitB" data-t="fit"></button>
        <button id="focB" data-t="focus"></button>
      </div>
      <p class="hint" id="hint"></p>
      <p class="notice" id="notice" hidden></p>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="time" aria-label="Time">
    <button class="play" id="playB"></button>
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <input type="range" id="yr" min="1925" max="2026" step="1" value="2026">
    </div>
    <output class="year" id="yrOut" for="yr">2026</output>
  </section>
  <div class="under">
    <p class="stats" id="stats" style="margin:0"></p>
    <div class="legend" id="legend"></div>
  </div>

  <section class="notes">
    <h3 data-t="nTitle"></h3>
    <ol id="notes"></ol>
  </section>
</div>

const L = {}; let B = null;

function pos(id) {
  const n = L[id];
  const mx = B.minX + B.maxX - n.x;
  return { x: n.x + (mx - n.x) * state.mirror, y: n.y };
}

// Relations (siblings derived, never stored)
const parentUnion = id => UNIONS.find(u => u.kids.includes(id));
const unionsOf = id => UNIONS.filter(u => u.a === id || u.b === id);
function relations(id) {
  const pu = parentUnion(id);
  const parents = pu ? [pu.a, pu.b] : [];
  const spouses = unionsOf(id).map(u => ({ id: u.a === id ? u.b : u.a, year: u.year }));
  const children = unionsOf(id).flatMap(u => u.kids);
  const sib = new Map();
  if (pu) {
    pu.kids.forEach(k => k !== id && sib.set(k, false));
    parents.forEach(par => unionsOf(par).forEach(u => u !== pu && u.kids.forEach(k => !sib.has(k) && sib.set(k, true))));
  }
  const biz = BIZ.filter(b => b.owners.includes(id));
  return { parents, spouses, children, siblings: [...sib].map(([k, half]) => ({ id: k, half })), biz };
}

// ---------- Layout with ELK ----------
function buildGraph() {
  const order = ['k1', 'f1', 'u1', 'ai', 'a1', 'no', 'u2', 'u3', 'ra', 'am', 'u5', 'kh', 'da', 'u8', 'ft', 'mh', 'sa', 'he', 'om', 're', 'u7', 'za', 'm1', 's1', 'sh', 'u4', 'su', 'mo', 'u6', 'hm', 'al', 'la'];
  const children = order.map(id => (uById[id] ? { id, width: 12, height: 12 } : { id, width: CW, height: CH }));
  const edges = [];
  UNIONS.forEach(u => {
    edges.push({ id: `${u.id}-a`, sources: [u.a], targets: [u.id] }, { id: `${u.id}-b`, sources: [u.b], targets: [u.id] });
    u.kids.forEach(k => edges.push({ id: `${u.id}-${k}`, sources: [u.id], targets: [k] }));
  });
  return {
    id: 'root', children, edges,
    layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'DOWN',
      'elk.layered.layering.strategy': 'NETWORK_SIMPLEX',
      'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
      'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX',
      'elk.spacing.nodeNode': '22', 'elk.layered.spacing.nodeNodeBetweenLayers': '34',
    },
  };
}

const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

function build2D() {

function render2D() {
  if (!B) return;
  PEOPLE.forEach(p => {
    const n = R.nodes[p.id], q = pos(p.id);
    n.g.setAttribute('transform', `translate(${q.x - CW / 2},${q.y - CH / 2})`);
    n.g.classList.toggle('gone', !visible(p.id));
    n.g.classList.toggle('dead', !!dead(p.id));
    n.g.classList.toggle('sel', state.sel === p.id);
    n.biz.style.display = BIZ.some(b => b.owners.includes(p.id) && b.year <= state.year) ? '' : 'none';
  });
  UNIONS.forEach(u => {
    const q = pos(u.id);
    R.unions[u.id].setAttribute('transform', `translate(${q.x},${q.y})`);
    R.unions[u.id].classList.toggle('gone', !uVisible(u));
  });
  R.spEdges.forEach(({ u, p, e }) => {
    const a = pos(p), m = pos(u.id), y0 = a.y + CH / 2;
    e.setAttribute('d', `M${a.x},${y0} C${a.x},${m.y} ${a.x},${m.y} ${m.x},${m.y}`);
    e.classList.toggle('gone', !uVisible(u));
  });
  R.kidEdges.forEach(({ u, k, e }) => {
    const m = pos(u.id), c = pos(k), top = c.y - CH / 2, mid = (m.y + top) / 2;
    e.setAttribute('d', `M${m.x},${m.y} V${mid} H${c.x} V${top}`);
    e.classList.toggle('gone', !(uVisible(u) && visible(k)));
  });
}

// Pan and zoom, shared by every SVG view
function panZoom(svgEl, gEl, onChange) {
  const v = { k: 1, tx: 0, ty: 0, moved: false };
  let drag = null;
  v.apply = () => { gEl.setAttribute('transform', `translate(${v.tx},${v.ty}) scale(${v.k})`); onChange && onChange(v); };
  v.zoomAt = (mx, my, f) => {
    const k = Math.min(3, Math.max(0.15, v.k * f)); f = k / v.k;
    v.tx = mx - (mx - v.tx) * f; v.ty = my - (my - v.ty) * f; v.k = k; v.apply();
  };
  v.zoomCenter = f => { const r = svgEl.getBoundingClientRect(); v.zoomAt(r.width / 2, r.height / 2, f); };
  v.fitBox = (x0, y0, x1, y1, pad = 36, max = 1.2) => {
    const r = svgEl.getBoundingClientRect(); if (!r.width) return;
    v.k = Math.min((r.width - 2 * pad) / (x1 - x0), (r.height - 2 * pad - 30) / (y1 - y0), max);
    v.tx = r.width / 2 - v.k * (x0 + x1) / 2; v.ty = r.height / 2 - v.k * (y0 + y1) / 2; v.apply();
  };
  v.fitContent = (pad, max) => { const b = gEl.getBBox(); if (b.width) v.fitBox(b.x, b.y, b.x + b.width, b.y + b.height, pad, max); };
  v.center = (x, y, minK = 0.9) => {
    const r = svgEl.getBoundingClientRect(); v.k = Math.max(v.k, minK);
    v.tx = r.width / 2 - v.k * x; v.ty = r.height / 2 - v.k * y; v.apply();
  };
  v.toLocal = (cx, cy) => { const r = svgEl.getBoundingClientRect(); return { x: (cx - r.left - v.tx) / v.k, y: (cy - r.top - v.ty) / v.k }; };
  svgEl.addEventListener('wheel', e => { e.preventDefault(); const r = svgEl.getBoundingClientRect(); v.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  svgEl.addEventListener('pointerdown', e => { v.moved = false; if (e.target.closest('.nodrag')) return; drag = { x: e.clientX, y: e.clientY, tx: v.tx, ty: v.ty }; });
  addEventListener('pointermove', e => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!v.moved && Math.hypot(dx, dy) > 4) { v.moved = true; svgEl.classList.add('drag'); }
    if (v.moved) { v.tx = drag.tx + dx; v.ty = drag.ty + dy; v.apply(); }
  });
  addEventListener('pointerup', () => { drag = null; svgEl.classList.remove('drag'); });
  return v;
}
const pzT = panZoom(svg, vp);
const fit2D = () => pzT.fitBox(B.minX - CW / 2, B.minY - CH / 2, B.maxX + CW / 2, B.maxY + CH / 2);
const focus2D = id => { const q = pos(id); pzT.center(q.x, q.y); };

// ---------- Graph view: Obsidian-style (force-graph on canvas, 3d-force-graph on three.js) ----------
const graphEl = document.getElementById('graphView');
const g2El = document.getElementById('graph2d'), g3El = document.getElementById('graph3d');
const PALETTE = {
  mansouri: '#2f9e91', kaabi: '#c98a2b', zaabi: '#8e72d8', suwaidi: '#d0627f', mazrouei: '#3e8ed0',
  shamsi: '#7da23b', ketbi: '#cf7440', hammadi: '#5b6cd8', marri: '#c05bb2', nuaimi: '#8a96a3',
};
const GX = { mode: '2d', f2: null, f3: null, s2: null, s3: null, sig: '', hover: null, nb: new Map(), col: {},
  opt: { families: true, biz: true, cards: true, fade: 0.8, size: 1, repel: 110, dist: 30 } };
function readCols() {
  const s = getComputedStyle(app);
  ['--ink', '--muted', '--line', '--line-strong', '--surface', '--surface-2', '--accent', '--gold', '--bg', '--dead-fill'].forEach(k => (GX.col[k] = s.getPropertyValue(k).trim()));
}
const rgba = (hex, a) => { const n = parseInt(hex.replace('#', ''), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const isDark = () => parseInt(GX.col['--bg'].replace('#', ''), 16) < 0x808080;
const nid = x => (typeof x === 'object' ? x.id : x);
const rad = n => GX.opt.size * (n.kind === 'h' ? 4 + Math.sqrt(n.deg) * 1.3 : n.kind === 'b' ? 4.2 : 3 + Math.sqrt(n.deg) * 1.05);
const gLabel = n => (n.kind === 'h' ? FAM[n.fam][state.lang] : n.kind === 'b' ? n.b[state.lang] : cardName(n.p));
const isOn = id => !GX.hover || id === GX.hover || !!GX.nb.get(GX.hover)?.has(id);
const isHiLink = l => !!GX.hover && (nid(l.source) === GX.hover || nid(l.target) === GX.hover);

function makeStore() {
  const nodes = [], links = [];
  Object.keys(FAM).forEach(f => nodes.push({ id: `fam:${f}`, kind: 'h', fam: f }));
  PEOPLE.forEach(p => nodes.push({ id: p.id, kind: 'p', p, fam: p.fam }));
  BIZ.forEach(b => nodes.push({ id: b.id, kind: 'b', b }));
  const add = (s, tg, kind, u) => links.push({ source: s, target: tg, kind, u });
  UNIONS.forEach(u => { add(u.a, u.b, 'sp', u); u.kids.forEach(k => { add(u.a, k, 'pc', u); add(u.b, k, 'pc', u); }); });
  BIZ.forEach(b => b.owners.forEach(o => add(o, b.id, 'bz')));
  PEOPLE.forEach(p => { add(p.id, `fam:${p.fam}`, 'fam'); if (p.also) add(p.id, 'fam:nuaimi', 'fam'); });
  const deg = {};
  links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
  nodes.forEach(n => (n.deg = deg[n.id] || 0));
  return { nodes, links, byId: Object.fromEntries(nodes.map(n => [n.id, n])) };
}

// Only what exists in the chosen year, with the chosen filters
function filtered(S) {
  const keep = new Set();
  S.nodes.forEach(n => {
    const ok = n.kind === 'p' ? visible(n.id)
      : n.kind === 'b' ? GX.opt.biz && n.b.year <= state.year
      : GX.opt.families && PEOPLE.some(p => (p.fam === n.fam || (n.fam === 'nuaimi' && p.also)) && visible(p.id));
    if (ok) keep.add(n.id);
  });
  const links = S.links.filter(l => keep.has(nid(l.source)) && keep.has(nid(l.target)) && (l.kind !== 'sp' || state.year >= l.u.year));
  const nodes = S.nodes.filter(n => keep.has(n.id));
  // A newcomer starts next to a relative, so the family visibly grows outward
  nodes.forEach(n => {
    if (n.x !== undefined) return;
    const l = links.find(k => k.kind !== 'fam' && (nid(k.source) === n.id || nid(k.target) === n.id));
    const o = l && S.byId[nid(l.source) === n.id ? nid(l.target) : nid(l.source)];
    if (o && o.x !== undefined) {
      n.x = o.x + (Math.random() - 0.5) * 6; n.y = o.y + (Math.random() - 0.5) * 6;
      if (o.z !== undefined) n.z = o.z + (Math.random() - 0.5) * 6;
    }
  });
  GX.nb = new Map();
  links.forEach(l => {
    const a = nid(l.source), b = nid(l.target);
    if (!GX.nb.has(a)) GX.nb.set(a, new Set());
    if (!GX.nb.has(b)) GX.nb.set(b, new Set());
    GX.nb.get(a).add(b); GX.nb.get(b).add(a);
  });
  return { nodes, links };
}

const CARD = { p: [104, 32], b: [92, 26] };
function box(n) {
  const s = GX.opt.size;
  if (GX.opt.cards && n.kind !== 'h') { const [w, h] = CARD[n.kind]; return [w * s, h * s]; }
  const r = (n.kind === 'h' && GX.opt.cards ? 1.7 : 1) * rad(n); return [r * 2, r * 2];
}
// Placeholder portrait: head-and-shoulders silhouette on the family colour. A real photo replaces it.
const AV = new Map();
function avatar(p) {
  const key = `${p.id}|${dead(p.id) ? 1 : 0}|${p.photoV || 0}`;
  if (AV.has(key)) return AV.get(key);
  const S = 128, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 4, 0, 2 * Math.PI); g.clip();
  if (p.photo) {
    const im = p.photo, k = Math.max(S / im.width, S / im.height);
    g.drawImage(im, (S - im.width * k) / 2, (S - im.height * k) / 2, im.width * k, im.height * k);
  } else {
    const col = PALETTE[p.fam], grad = g.createLinearGradient(0, 0, 0, S);
    grad.addColorStop(0, rgba(col, 0.55)); grad.addColorStop(1, col);
    g.fillStyle = grad; g.fillRect(0, 0, S, S);
    g.fillStyle = 'rgba(255,255,255,0.88)';
    g.beginPath(); g.arc(S / 2, S * 0.4, S * 0.19, 0, 2 * Math.PI); g.fill();
    g.beginPath(); g.ellipse(S / 2, S * 0.98, S * 0.36, S * 0.33, 0, Math.PI, 2 * Math.PI); g.fill();
  }

// Keep cards from overlapping: boxes in 2D, spheres in 3D
function cardCollide() {

    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], [aw, ah] = box(a), [bw, bh] = box(b);
      if (a.z !== undefined && b.z !== undefined) {
        const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 1, min = (aw + bw) / 2.6;
        if (d < min) { const k = ((min - d) / d) * 0.25; a.vx -= dx * k; a.vy -= dy * k; a.vz -= dz * k; b.vx += dx * k; b.vy += dy * k; b.vz += dz * k; }
        continue;

      const dx = b.x - a.x, dy = b.y - a.y, ox = (aw + bw) / 2 + 8 - Math.abs(dx), oy = (ah + bh) / 2 + 8 - Math.abs(dy);

        else { const m = oy * 0.25 * (dy < 0 ? -1 : 1); a.vy -= m; b.vy += m; }

}

function applyForces(f) {

  f.d3Force('charge').strength(-GX.opt.repel * (GX.opt.cards ? 3 : 1));
  f.d3Force('link')
    .distance(l => (l.kind === 'fam' ? d * 1.5 : l.kind === 'sp' ? d * 0.6 : l.kind === 'bz' ? d * 1.1 : d))
    .strength(l => (l.kind === 'fam' ? (l.target.deg ?? 2) <= 2 ? 0.9 : 0.12 : 0.55));
  if (!f.d3Force('collide')) f.d3Force('collide', cardCollide());

}

function draw2D(n, ctx, k) {

const spouseOf = (u, id) => byId[u.a === id ? u.b : u.a];

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.1/+esm';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/controls/OrbitControls.js/+esm';
import ForceGraph3D from 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/+esm';
window.ForceGraph3D = ForceGraph3D;

const A = window.APP, S = 0.1, YS = 1.35;

const sprites = {}, unionDots = {}, plates = [];
const edges = [];
const css = n => getComputedStyle(document.getElementById('app')).getPropertyValue(n).trim();

function to3(id) {

  const z = p ? (p.mi ? 7 : 0) : 3.5;
  return new THREE.Vector3((q.x - (B.minX + B.maxX) / 2) * S, -(q.y - (B.minY + B.maxY) / 2) * S * YS, z);
}

function cardTexture(p) {
  const w = A.CW * 4, h = A.CH * 4, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), sel = A.state.sel === p.id, rtl = A.state.lang === 'ar';
  g.fillStyle = css('--surface'); g.strokeStyle = sel ? css('--accent') : css('--line'); g.lineWidth = sel ? 10 : 4;
  g.beginPath(); g.roundRect(5, 5, w - 10, h - 10, 34); g.fill(); g.stroke();
  g.textAlign = 'center'; g.direction = rtl ? 'rtl' : 'ltr';
  g.fillStyle = css('--ink'); g.font = `600 50px "IBM Plex Sans Arabic", sans-serif`; g.fillText(A.cardName(p), w / 2, 92, w - 40);
  g.fillStyle = p.mi ? css('--gold') : css('--muted'); g.font = `42px "IBM Plex Mono", monospace`; g.direction = 'ltr'; g.fillText(A.years(p), w / 2, 162);

function build() {

  controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxDistance = 600; controls.minDistance = 8;
  A.PEOPLE.forEach(p => {

    const s = new THREE.Sprite(m); s.scale.set(A.CW * S, A.CH * S, 1); s.userData.id = p.id; scene.add(s); sprites[p.id] = s;
  });

  A.UNIONS.forEach(u => {
    const d = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: css('--gold') })); scene.add(d); unionDots[u.id] = d;
    edges.push({ a: u.a, b: u.id, vis: () => A.uVisible(u) }, { a: u.b, b: u.id, vis: () => A.uVisible(u) });
    u.kids.forEach(k => edges.push({ a: u.id, b: k, vis: () => A.uVisible(u) && A.visible(k) }));

  const rad = ((B.maxX - B.minX) * S) / 2 + 14;
  rows.forEach(y => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(rad, 64), new THREE.MeshBasicMaterial({ color: css('--accent'), transparent: true, opacity: 0.07, side: THREE.DoubleSide, depthWrite: false }));

function frame() {

  });

  edges.forEach((e, i) => {
    const a = to3(e.a), b = e.vis() ? to3(e.b) : a;
    if (A.byId[e.a]) a.y -= A.CH * S / 2;
    if (A.byId[e.b] && e.vis()) b.y += A.CH * S / 2;
    lineArr.set([a.x, a.y, a.z, e.vis() ? b.x : a.x, e.vis() ? b.y : a.y, e.vis() ? b.z : a.z], i * 6);
  });

  plates.forEach(m => (m.visible = m.userData.ids.some(A.visible)));

function resize() {

}
function fitView(animate = true) {

  const fov = (camera.fov * Math.PI) / 180, dist = Math.max(H / 2 / Math.tan(fov / 2), W / 2 / Math.tan(fov / 2) / camera.aspect) * 1.15;

  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);

}

function refresh() {
  if (!ready) return;
  A.PEOPLE.forEach(p => { const m = sprites[p.id].material; m.map.dispose(); m.map = cardTexture(p); m.needsUpdate = true; });
  lines.material.color.set(css('--line-strong'));
  Object.values(unionDots).forEach(d => d.material.color.set(css('--gold')));
  plates.forEach(m => m.material.color.set(css('--accent')));
}

window.Tree3D = {
  mount(el) {
    if (ready) return true;
    if (!A.B) return false;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch { return false; }
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    renderer.domElement.addEventListener('pointerdown', onDown);
    renderer.domElement.addEventListener('pointerup', onUp);

    document.fonts.ready.then(refresh);

  },
  start() { if (ready && !raf) { resize(); raf = requestAnimationFrame(frame); } },
  stop() { cancelAnimationFrame(raf); raf = 0; },
  refresh, focus, fit: () => fitView(true),
  // Any painted canvas as a camera-facing sprite (cards in the 3D graph)
  canvasSprite(cv, w, h, opacity = 1) {
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity }));

  },
  // Text label for the 3D graph's nodes, drawn on a canvas so Arabic letters join correctly

    g.font = font; c.width = Math.ceil(g.measureText(text).width) + pad * 2; c.height = fs + pad * 2;
    g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, c.width / 2, c.height / 2);

};

</script>
